[project]
name = "clear-tonight"
version = "0.1.0"
description = "Will the sky really be clear tonight? The weather app's cloud forecast, corrected by TabPFN v2 from its own track record."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["tabpfn>=2.0", "httpx", "pandas", "numpy", "scikit-learn", "ephem"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
clear-tonight = "clear_tonight.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clear_tonight"]
