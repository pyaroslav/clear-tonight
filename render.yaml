# Render Blueprint: a free static site serving site/. tonight.json is refreshed daily by the GitHub Action;
# the page reads the latest copy from the repo, so it stays fresh even without a redeploy.
services:
  - type: web
    runtime: static
    name: clear-tonight
    buildCommand: "echo static"
    staticPublishPath: ./site
    autoDeploy: true
    headers:
      - path: /*.json
        name: Cache-Control
        value: no-cache
